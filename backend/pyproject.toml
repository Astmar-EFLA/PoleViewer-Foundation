[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pole-viewer-backend"
version = "0.1.0"
description = "Local FastAPI + PDAL processing backend for the pole/tower engineering viewer."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
